<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="org.harbour.flotsam.Sync"/>
    <deny send_destination="org.harbour.flotsam.Sync"/>
  </policy>
  <!-- The per-user daemon owns the name. UI verifies its kernel credentials
       and pins the unique owner before any management/password call. Dynamic
       privileged eGID and UI identity are checked by the daemon, not NSS groups. -->
  <!-- Targeted updates use the system bus's existing signal policy. Do not
       grant additional destinationless signal permissions here. -->
  <policy user="defaultuser">
    <allow own="org.harbour.flotsam.Sync"/>
    <allow send_destination="org.harbour.flotsam.Sync"/>
  </policy>
  <policy user="nemo">
    <allow own="org.harbour.flotsam.Sync"/>
    <allow send_destination="org.harbour.flotsam.Sync"/>
  </policy>
</busconfig>
