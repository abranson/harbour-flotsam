<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.harbour.flotsam.Connman"/>
    <allow send_destination="net.connman"/>
  </policy>
  <!-- The unprivileged sync daemon may request operations; the helper is
       still the only process permitted to talk to ConnMan itself. -->
  <policy user="nemo">
    <allow send_destination="org.harbour.flotsam.Connman"/>
  </policy>
  <policy user="defaultuser">
    <allow send_destination="org.harbour.flotsam.Connman"/>
  </policy>
  <policy context="default">
    <deny own="org.harbour.flotsam.Connman"/>
    <deny send_destination="org.harbour.flotsam.Connman"/>
  </policy>
</busconfig>
