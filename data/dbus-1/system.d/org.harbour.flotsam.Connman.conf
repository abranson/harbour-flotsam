<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.harbour.flotsam.Connman"/>
    <allow send_destination="net.connman"/>
  </policy>
  <!-- Public access activates the helper and permits read-only attestation.
       ConnMan operations are available
       exclusively on its root-owned, privileged-group Unix socket. -->
  <policy user="nemo">
    <allow send_destination="org.harbour.flotsam.Connman" send_interface="org.harbour.flotsam.Identity1" send_member="VerifyDaemon" send_path="/org/harbour/flotsam/Connman"/>
    <allow send_destination="org.harbour.flotsam.Connman" send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
  </policy>
  <policy user="defaultuser">
    <allow send_destination="org.harbour.flotsam.Connman" send_interface="org.harbour.flotsam.Identity1" send_member="VerifyDaemon" send_path="/org/harbour/flotsam/Connman"/>
    <allow send_destination="org.harbour.flotsam.Connman" send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
  </policy>
  <policy context="default">
    <deny own="org.harbour.flotsam.Connman"/>
    <deny send_destination="org.harbour.flotsam.Connman"/>
  </policy>
</busconfig>
