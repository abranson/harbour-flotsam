name: SailfishOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qt test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qtbase5-dev

      - name: Build and run tests
        run: |
          set -euo pipefail
          for suite in common webdav; do
            mkdir -p "$RUNNER_TEMP/flotsam-tests/$suite"
            (
              cd "$RUNNER_TEMP/flotsam-tests/$suite"
              qmake "$GITHUB_WORKSPACE/tests/$suite/$suite.pro"
              make -j"$(nproc)"
              ./tst_flotsam_"$suite"
            )
          done

  build:
    name: Sailfish OS aarch64 RPM
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE: 5.2.0.15
      ARCH: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare SDK
        run: docker pull "coderus/sailfishos-platform-sdk:${RELEASE}"

      - name: Build Sailfish OS packages
        run: |
          set -euo pipefail
          mkdir -p RPMS
          chmod a+w RPMS
          docker run --rm --privileged \
            -e RELEASE -e ARCH \
            -v "$PWD":/share \
            "coderus/sailfishos-platform-sdk:${RELEASE}" \
            bash -lc '
              set -euo pipefail
              # Match the working SDK helper: initialize the login environment
              # and keep sources accessible to Scratchbox under the SDK home.
              build_dir=$(mktemp -d "$HOME/flotsam-build.XXXXXX")
              chmod 0755 "$build_dir"
              cp -R /share/. "$build_dir/"
              cd "$build_dir"
              mb2 -t "SailfishOS-${RELEASE}-${ARCH}" --no-vcs-apply build -d
              cp -v RPMS/*.rpm /share/RPMS/
            '

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: harbour-flotsam-${{ env.ARCH }}
          path: RPMS/*.rpm
          if-no-files-found: error

  release:
    name: Release and publish RPMs
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: flotsam-package-repository-publish
      cancel-in-progress: false
    env:
      PACKAGE_REPO: ${{ github.repository_owner }}/repo
    steps:
      - name: Download RPMs
        uses: actions/download-artifact@v4
        with:
          name: harbour-flotsam-aarch64
          path: rpms

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: rpms/*.rpm
          fail_on_unmatched_files: true

      - name: Check publish configuration
        id: publish
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PUBLISH_REPO_TOKEN is not set; skipping RPM repository publication."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail visibly for a configured but invalid/inaccessible token.
          gh api "repos/$PACKAGE_REPO" --silent
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout RPM repository
        if: steps.publish.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PACKAGE_REPO }}
          ref: master
          token: ${{ secrets.PUBLISH_REPO_TOKEN }}
          path: publish-repo

      - name: Install repository tools
        if: steps.publish.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y createrepo-c

      - name: Update RPM repository
        if: steps.publish.outputs.enabled == 'true'
        working-directory: publish-repo
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpms=(../rpms/*.rpm)
          if [ "${#rpms[@]}" -eq 0 ]; then
            echo "::error::No RPMs to publish."
            exit 1
          fi
          mkdir -p aarch64
          for rpm in "${rpms[@]}"; do
            filename=${rpm##*/}
            if [[ ! $filename =~ ^(harbour-flotsam|harbour-flotsam-debuginfo|harbour-flotsam-debugsource)-[0-9][^-]*-[^-]+\.aarch64\.rpm$ ]]; then
              echo "::error::Unexpected RPM artifact."
              exit 1
            fi
            package=${BASH_REMATCH[1]}
            # The numeric version boundary excludes other Flotsam packages.
            old_rpms=(aarch64/"$package"-[0-9]*.aarch64.rpm)
            if [ "${#old_rpms[@]}" -gt 0 ]; then
              rm -- "${old_rpms[@]}"
            fi
            install -m 0644 "$rpm" "aarch64/$filename"
          done
          createrepo_c --update aarch64
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add aarch64
          if ! git diff --cached --quiet; then
            git commit -m "Release harbour-flotsam $RELEASE_TAG"
            # Never force: concurrent repository updates must not be overwritten.
            git push origin HEAD:master
          fi
